name: Finalize uploaded prebuilt draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing unpublished draft tag to sign and publish
        required: true

permissions:
  actions: write
  contents: read

jobs:
  dispatch-signing:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate draft and immutable assets
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo 'finalize releases only from the main branch' >&2
            exit 2
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9A-Za-z._-]+$ ]] || {
            echo 'tag must use the form v<version>' >&2
            exit 2
          }
          [[ $(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft) == true ]] || {
            echo "release must be an unpublished draft: $RELEASE_TAG" >&2
            exit 1
          }
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets
          mapfile -t archives < <(find release-assets -maxdepth 1 -type f \
            \( -name 'omnicore-*.zip' -o -name 'omnicore-*.tar.gz' \) -print | sort)
          (( ${#archives[@]} >= 2 )) || {
            echo "Expected at least Windows CPU and macOS Metal archives, found ${#archives[@]}" >&2
            exit 1
          }
          for archive in "${archives[@]}"; do
            sidecar="$archive.sha256"
            [[ -f "$sidecar" ]] || { echo "Missing $sidecar" >&2; exit 1; }
            expected=$(awk 'NR == 1 { print $1 }' "$sidecar")
            actual=$(sha256sum "$archive" | awk '{ print $1 }')
            [[ "$expected" == "$actual" ]] || {
              echo "SHA-256 sidecar mismatch for $archive" >&2
              exit 1
            }
          done
          version=${RELEASE_TAG#v}
          test -f "release-assets/omnicore-$version-windows-x86_64-cpu.zip"
          test -f "release-assets/omnicore-$version-macos-arm64-metal.tar.gz"
      - name: Dispatch signing and metadata workflow
        run: |
          set -euo pipefail
          gh workflow run sign-release.yml \
            --ref main \
            -f "tag=$RELEASE_TAG"

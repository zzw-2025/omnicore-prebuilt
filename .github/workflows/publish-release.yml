name: Finalize uploaded prebuilt draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing unpublished draft tag to sign and publish
        required: true
      release_profile:
        description: Required runtime set for this Release
        required: true
        type: choice
        default: full
        options:
          - full
          - windows-cpu-preview

permissions:
  actions: write
  contents: read

jobs:
  dispatch-signing:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_PROFILE: ${{ inputs.release_profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate draft and immutable assets
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo 'finalize releases only from the main branch' >&2
            exit 2
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9A-Za-z._-]+$ ]] || {
            echo 'tag must use the form v<version>' >&2
            exit 2
          }
          release_json=$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease)
          [[ $(jq -r .isDraft <<<"$release_json") == true ]] || {
            echo "release must be an unpublished draft: $RELEASE_TAG" >&2
            exit 1
          }
          if [[ "$RELEASE_PROFILE" == windows-cpu-preview ]]; then
            [[ $(jq -r .isPrerelease <<<"$release_json") == true ]] || {
              echo 'windows-cpu-preview must be marked as a prerelease' >&2
              exit 1
            }
          fi
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets
          python scripts/validate-release-assets.py \
            --assets-dir release-assets \
            --tag "$RELEASE_TAG" \
            --profile "$RELEASE_PROFILE"
      - name: Dispatch signing and metadata workflow
        run: |
          set -euo pipefail
          gh workflow run sign-release.yml \
            --ref main \
            -f "tag=$RELEASE_TAG" \
            -f "release_profile=$RELEASE_PROFILE"

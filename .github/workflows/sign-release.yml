name: Sign published release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to sign
        required: true

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  sign:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require an unpublished draft release
        run: |
          set -euo pipefail
          is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          if [[ "$is_draft" != 'true' ]]; then
            echo "Refusing to replace assets or metadata on a published Release: $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download runtime archives
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$RELEASE_TAG" \
            --dir release-assets \
            --pattern 'omnicore-*.zip' \
            --pattern 'omnicore-*.tar.gz'
          find release-assets -maxdepth 1 -type f -print
      - name: Sign archives with GitHub OIDC
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/omnicore-*.zip release-assets/omnicore-*.tar.gz)
          if (( ${#assets[@]} == 0 )); then
            echo 'No OmniCore runtime archives found' >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            cosign sign-blob --yes \
              --bundle "${asset}.sigstore.json" \
              "$asset"
          done
      - name: Upload Sigstore bundles
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release-assets/*.sigstore.json --clobber
      - name: Verify signed archives
        run: |
          set -euo pipefail
          shopt -s nullglob
          for asset in release-assets/omnicore-*.zip release-assets/omnicore-*.tar.gz; do
            cosign verify-blob \
              --bundle "${asset}.sigstore.json" \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$asset"
          done
      - name: Generate published manifest and OmniInfer catalog
        run: |
          set -euo pipefail
          python scripts/prepare-release-manifest.py \
            --assets-dir release-assets \
            --tag "$RELEASE_TAG" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --output release-manifest.json
          python scripts/emit-omniinfer-catalog.py \
            --manifest release-manifest.json \
            --output omniinfer-catalog.json
      - name: Upload verified metadata
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            release-manifest.json \
            omniinfer-catalog.json \
            --clobber
      - name: Publish verified draft release
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Open manifest update pull request
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cp release-manifest.json manifest.json
          if git diff --quiet -- manifest.json; then
            echo 'Repository manifest already matches this Release'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch="release-manifest-${RELEASE_TAG//[^A-Za-z0-9._-]/-}-$RUN_ID"
          git checkout -b "$branch"
          git add manifest.json
          git commit -m "release: publish $RELEASE_TAG manifest"
          git push origin "HEAD:$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "release: publish $RELEASE_TAG manifest" \
            --body "Generated from signed and verified assets in Release $RELEASE_TAG."
